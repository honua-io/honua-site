name: Apply deployment presentation
on:
  push:
    branches: [website/unified-deployment-view]
    paths: [.github/workflows/apply-deployment-view.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: website/unified-deployment-view
      - name: Apply checksum-verified edits to the reviewed source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/website/unified-deployment-view
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          encoded=Path('.github/deployment-refresh.b64').read_text().strip()
          marker='CYE06DOblNsw'
          assert encoded.count(marker)==1
          prefix=''
          encoded=prefix+marker+encoded.split(marker,1)[1]
          payload=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(payload).hexdigest()=='c2ec76d1c299bb55dfa9d444fd7f3aad366059a2dc13a601aa72aacb2e14ddf3'
          changes=json.loads(payload)
          allowed={'architecture.html','assets/architecture-explorer.css','assets/architecture.js','assets/remodel.css','assets/remodel.js','capabilities.html','scripts/capability-hub-render.mjs','scripts/capability-hub.test.mjs','scripts/capture-design-review.mjs','scripts/deployment-presentation.test.mjs','scripts/platform-overview.test.mjs'}
          assert {c['path'] for c in changes}==allowed and len(changes)==len(allowed)
          outputs={}
          for change in changes:
              p=Path(change['path'])
              old=p.read_text() if p.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==change['before'],f'Source moved: {p}'
              text=old
              previous=len(old)+1
              for start,end,replacement in reversed(change['edits']):
                  assert 0<=start<=end<=len(old) and end<=previous
                  text=text[:start]+replacement+text[end:]
                  previous=start
              assert hashlib.sha256(text.encode()).hexdigest()==change['after'],f'Output mismatch: {p}'
              outputs[p]=text
          for p,text in outputs.items(): p.write_text(text)
          PY
          git rm -- .github/deployment-refresh.b64 .github/workflows/deployment-source-review.yml .github/workflows/apply-deployment-view.yml
      - name: Validate source, generation and the actual build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --check assets/architecture.js
          node --check scripts/capture-design-review.mjs
          node scripts/gen-capability-catalog.mjs --check
          node scripts/prepare-marketing-pages.mjs --check
          node --test scripts/*.test.mjs
          ./scripts/validate-workflow-pinning.sh
          ./scripts/validate-lead-capture.sh
          ./scripts/validate-security-headers.sh
          node scripts/validate-site-claims.mjs
          node scripts/validate-internal-links.mjs
          ./scripts/build-dist.sh
      - name: Exercise the browser and capture previews
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/honua-deployment-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in 1 2 3 4 5; do
            if curl --silent --fail http://127.0.0.1:8765/architecture.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-design-review.mjs http://127.0.0.1:8765/
      - name: Upload actual-build previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: honua-deployment-presentation-previews
          path: review-screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit the validated presentation changes
        run: |
          set -euo pipefail
          git config user.name 'Mike McDougall'
          git config user.email 'mike@honua.io'
          git add architecture.html capabilities.html assets/architecture-explorer.css assets/architecture.js assets/remodel.css assets/remodel.js scripts/capability-hub-render.mjs scripts/capability-hub.test.mjs scripts/capture-design-review.mjs scripts/deployment-presentation.test.mjs scripts/platform-overview.test.mjs
          git commit -m 'feat: unify deployment choices and use neutral headings'
          git push origin HEAD:refs/heads/website/unified-deployment-view
