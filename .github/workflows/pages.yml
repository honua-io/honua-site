name: Pages

on:
  pull_request:
    branches:
      - trunk
    paths:
      - "**"
  push:
    branches:
      - trunk
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Validate workflow action pinning
        run: ./scripts/validate-workflow-pinning.sh
      - name: Validate lead capture contract
        run: ./scripts/validate-lead-capture.sh
      - name: Validate security headers (static _headers contract)
        run: |
          ./scripts/validate-security-headers.sh
          node --test edge/cloudfront-template.test.mjs
      - name: Validate operator claim status
        run: ./scripts/validate-operator-claims.sh
      - name: Validate public schema provenance
        run: node scripts/validate-public-schemas.mjs
      - name: Validate public package and site claims
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/gen-compatibility-matrix.mjs --check
          node scripts/gen-capability-catalog.mjs --check
          node scripts/sync-capabilities-data.mjs --check
          node --test scripts/capability-catalog.test.mjs
          node scripts/validate-capability-links.mjs
          node --test scripts/sdk-docs-versions.test.mjs
          node scripts/sdk-docs-versions.mjs --check
          node scripts/sdk-docs-versions.mjs --verify-remote
          node scripts/sdk-llms-publication.mjs
          node scripts/validate-site-claims.mjs
          node scripts/validate-internal-links.mjs
      - name: Samples gallery + flagship smoke
        run: |
          node scripts/sdk-sample-publication.mjs
          node scripts/site-sample-exceptions.mjs
          node scripts/site-demo-smoke.mjs
          node scripts/validate-demo-backend-override.mjs
      - name: Build artifact
        run: ./scripts/build-dist.sh
      - name: Validate machine docs artifact
        run: |
          test "$(head -n 1 ./dist/llms.txt)" = "# @honua/sdk-js"
          test -s ./dist/llms-full.txt
          test -s ./dist/data/sdk-docs-versions.v1.json
          ! grep -R "{{HONUA_SDK_" ./dist/*.html
          cmp ./schemas/diagnostic-bundle.v1.json ./dist/schemas/diagnostic-bundle.v1.json
      - name: Validate artifact security headers
        run: |
          test -f ./dist/_headers
          grep -Eq "Content-Security-Policy: .*frame-ancestors 'none'" ./dist/_headers

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build artifact
        run: ./scripts/build-dist.sh
      # actions/upload-pages-artifact excludes dot-directories (--exclude=".[^/]*"),
      # which drops /.well-known/security.txt. Archive manually so the .well-known
      # directory is preserved, then upload as the github-pages artifact deploy-pages expects.
      - name: Archive Pages artifact (preserve .well-known)
        run: |
          tar \
            --dereference --hard-dereference \
            --exclude=.git \
            --exclude=.github \
            --directory ./dist \
            -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Validate live security headers
        env:
          HONUA_HEADER_CHECK_URL: https://honua.io/
        run: |
          live_headers="$(node -p "require('./edge/production-status.json').liveResponseHeaders")"
          if [[ "${live_headers}" == "false" ]]; then
            echo "::notice::Response-header enforcement is not active; tracked by issue #38."
            exit 0
          fi
          if [[ "${live_headers}" != "true" ]]; then
            echo "Invalid edge/production-status.json liveResponseHeaders value: ${live_headers}" >&2
            exit 1
          fi
          export HONUA_REQUIRE_LIVE_HEADERS=1
          for attempt in 1 2 3; do
            if ./scripts/validate-security-headers.sh; then
              exit 0
            fi
            if [[ "${attempt}" != "3" ]]; then
              echo "Live edge headers are not visible yet; retrying in 10 seconds."
              sleep 10
            fi
          done
          exit 1
