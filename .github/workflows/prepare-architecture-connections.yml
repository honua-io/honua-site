name: Prepare architecture connections
on:
  push:
    branches: [website/architecture-clients-databases-interfaces]
    paths: [.github/workflows/prepare-architecture-connections.yml]
permissions:
  contents: write
concurrency:
  group: prepare-architecture-connections
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'honua-io/honua-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ github.sha }}
      - name: Apply scoped architecture changes
        run: |
          set -euo pipefail
          test "$(git hash-object architecture.html)" = ad480037db7a7a5c8c4d35a20283e1b54795d411
          python3 - <<'PY'
          from pathlib import Path
          import json, html
          path = Path('architecture.html')
          text = path.read_text()
          def replace_once(old, new):
              global text
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          replace_once('<span>Desktop GIS clients</span>', '<span>ArcGIS Pro</span>')
          interfaces = ['GeoServices REST', 'OGC APIs', 'OGC web services', 'OData', 'STAC', 'Tiles', 'gRPC', 'MCP']
          chips = ''.join('<span>' + html.escape(name) + '</span>' for name in interfaces)
          replace_once('<span>GeoServices REST</span><span>OGC APIs &amp; services</span><span>OData · STAC · tiles</span><span>gRPC · MCP</span>', chips)
          replace_once('<span>GeoServices REST</span><span>OGC</span><span>OData / STAC</span><span>Tiles</span><span>gRPC / MCP</span>', chips)
          replace_once('<span>MCP / gRPC</span>', '<span>MCP</span>')
          providers = json.loads(Path('data/capability-navigation.v1.json').read_text())['providers']
          assert len(providers) == 8
          assert {p['title'] for p in providers} == {'PostgreSQL / PostGIS', 'SQL Server', 'DuckDB', 'MySQL / MariaDB', 'Oracle', 'Amazon Redshift', 'Snowflake', 'Databricks'}
          assert {p['title'] for p in providers if p['status'] == 'Experimental'} == {'Oracle', 'Amazon Redshift', 'Snowflake', 'Databricks'}
          groups = [
              ('Full read/write', [p for p in providers if p['access'] == 'Full read/write'], ''),
              ('Read/query', [p for p in providers if p['access'] != 'Full read/write' and not p['status']], ''),
              ('Read/query', [p for p in providers if p['status'] == 'Experimental'], '<small>Experimental</small>')
          ]
          data = ['<article class="arch-layer-card arch-layer-data">', '<span class="arch-kicker">03 · Data sources</span>', '<h3>Choose how to connect your data.</h3>', '<p>Create a layer from an existing table without copying its data, or import files and services. PostgreSQL/PostGIS supports full read/write; the other database providers offer read/query access.</p>', '<div class="arch-source-groups">']
          for label, items, status in groups:
              data += ['<section class="arch-source-group" aria-label="' + html.escape(label + (' · Experimental' if status else ''), quote=True) + '">', '<h4>' + label + status + '</h4>', '<div class="arch-chip-row">' + ''.join('<span data-database-provider="' + html.escape(p['title'], quote=True) + '">' + html.escape(p['title']) + '</span>' for p in items) + '</div>', '</section>']
          data += ['</div>', '<p class="arch-source-detail"><a href="capabilities.html#databases">Explore database capabilities →</a></p>', '<div class="arch-supporting-state">', '<h4>Files, coordination &amp; telemetry</h4>', '<div class="arch-chip-row"><span>Object storage</span><span>Redis · multi-node</span><span>OpenTelemetry backend</span></div>', '</div>', '</article>']
          start = text.index('<article class="arch-layer-card arch-layer-data">')
          end = text.index('</article>', start) + len('</article>')
          text = text[:start] + '\n'.join(data) + text[end:]
          path.write_text(text)
          css = Path('assets/architecture-explorer.css')
          css.write_text(css.read_text() + '''
          /* Keep each interface distinct and show the complete provider catalog. */
          #overview .arch-runtime-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          #overview .arch-layer-data { grid-column: 1 / -1; }
          #overview .arch-source-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 22px; }
          #overview .arch-source-group { min-width: 0; padding: 18px; border: 1px solid var(--bed-rule); border-radius: 5px; background: var(--bed-bg); }
          #overview .arch-source-group h4, #overview .arch-supporting-state h4 { margin: 0 0 14px; font-size: 14px; line-height: 1.5; letter-spacing: 0; }
          #overview .arch-source-group h4 small { display: inline-block; margin-left: 10px; color: var(--bed-amber); font-size: 11px; font-weight: 500; }
          #overview .arch-source-group .arch-chip-row, #overview .arch-supporting-state .arch-chip-row { margin-top: 0; }
          #overview .arch-source-detail { margin-top: 18px; font-size: 13px; }
          #overview .arch-source-detail a { color: var(--bed-teal-bright); text-decoration: underline; text-underline-offset: 4px; }
          #overview .arch-supporting-state { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--bed-rule); }
          @media (max-width: 760px) {
            #overview .arch-runtime-grid, #overview .arch-source-groups { grid-template-columns: minmax(0, 1fr); }
          }
          ''')
          Path('.github/workflows/prepare-architecture-connections.yml').unlink()
          PY
      - name: Validate the site and build
        run: |
          set -euo pipefail
          node scripts/prepare-marketing-pages.mjs --check
          node scripts/gen-capability-catalog.mjs --check
          node --test scripts/*.test.mjs edge/cloudfront-template.test.mjs
          ./scripts/validate-workflow-pinning.sh
          ./scripts/validate-lead-capture.sh
          ./scripts/validate-security-headers.sh
          node scripts/validate-internal-links.mjs
          ./scripts/build-dist.sh
      - name: Check desktop and mobile architecture views
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/capture-design-review.mjs').read_text()
          marker = "  await load('architecture.html');"
          assert source.count(marker) == 1
          prefix = source.split(marker)[0]
          ending = source[source.index('} finally {\n  for(const request'):]
          checks = r'''
            for (const width of [1440, 768, 390, 320]) {
              await load('architecture.html#overview', width, 1600);
              await send('Emulation.setFocusEmulationEnabled', { enabled: true });
              const state = await evaluate(`(() => {
                const panel = document.getElementById('overview');
                const chips = selector => [...panel.querySelectorAll(selector)].map(e => e.textContent.trim());
                return {
                  visible: panel.getClientRects().length > 0,
                  overflow: document.documentElement.scrollWidth > innerWidth + 1,
                  clients: chips('.arch-layer-clients .arch-chip-row > span'),
                  interfaces: chips('.arch-layer-runtime .arch-chip-row > span'),
                  providers: chips('[data-database-provider]'),
                  groups: chips('.arch-source-group h4'),
                  clipped: [...panel.querySelectorAll('.arch-chip-row > span')].some(e => { const r=e.getBoundingClientRect(); return r.left < 0 || r.right > innerWidth + 1; })
                };
              })()`);
              assert.ok(state.visible, 'Request-path deep link must open its panel');
              assert.equal(state.overflow, false, `Page overflow at ${width}`);
              assert.equal(state.clipped, false, `Clipped chip at ${width}`);
              assert.ok(state.clients.includes('ArcGIS Pro'));
              assert.ok(state.clients.includes('QGIS'));
              assert.deepEqual(state.interfaces, ['GeoServices REST','OGC APIs','OGC web services','OData','STAC','Tiles','gRPC','MCP']);
              assert.equal(state.providers.length, 8);
              assert.ok(state.groups.some(g => g.includes('Experimental')));
              await evaluate(`document.querySelector('#overview .arch-runtime-grid').scrollIntoView({block:'start',behavior:'instant'})`);
              await evaluate('new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))');
              const image = await send('Page.captureScreenshot', {format:'png',fromSurface:true,captureBeyondViewport:false});
              await writeFile(`review-screenshots/architecture-connections-${width}.png`, Buffer.from(image.data,'base64'));
              console.log(`Client, eight interfaces, eight providers, and overflow checks passed at ${width}px.`);
            }
            await load('architecture.html#concept', 390, 1100);
            assert.deepEqual(await evaluate(`[...document.querySelectorAll('#concept .h-protocols > span')].map(e=>e.textContent.trim())`), ['GeoServices REST','OGC APIs','OGC web services','OData','STAC','Tiles','gRPC','MCP']);
          '''
          Path('scripts/.architecture-connections-review.mjs').write_text(prefix + checks + ending)
          PY
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/honua-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --silent --fail http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/.architecture-connections-review.mjs http://127.0.0.1:8765/
          rm scripts/.architecture-connections-review.mjs
      - name: Commit the validated presentation changes
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- index.html data/capabilities.v1.json data/capability-navigation.v1.json
          git config user.name 'Mike McDougall'
          git config user.email 'mike@honua.io'
          git add architecture.html assets/architecture-explorer.css .github/workflows/prepare-architecture-connections.yml
          git commit -m 'feat: clarify architecture clients, interfaces and database choices'
          git push origin HEAD:refs/heads/website/architecture-clients-databases-interfaces
          git archive --format=tar.gz HEAD -o review-screenshots/source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: architecture-connections-review
          path: review-screenshots/
          if-no-files-found: warn
          retention-days: 7
