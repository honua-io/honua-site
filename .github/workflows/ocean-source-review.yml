name: Ocean palette source review
on:
  push:
    branches: [website/table-publishing-code-migration]
    paths: ['.github/workflows/ocean-source-review.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/honua-ocean-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: honua-ocean-source
          path: ${{ runner.temp }}/honua-ocean-source.tar.gz
          retention-days: 1
          if-no-files-found: error
