name: Deployment source review
on:
  push:
    branches: [website/unified-deployment-view]
    paths: [.github/workflows/deployment-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - name: Export tracked source for layout review
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/honua-site.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deployment-layout-source
          path: ${{ runner.temp }}/honua-site.tar.gz
          retention-days: 1
          if-no-files-found: error
