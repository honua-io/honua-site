name: Apply capability presentation
on:
  push:
    branches: [website/capabilities-functionality-and-formats]
    paths: [.github/workflows/capability-presentation-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: website/capabilities-functionality-and-formats
      - name: Apply the checksum-verified review patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/website/capabilities-functionality-and-formats
          python3 - <<'PY'
          import base64, hashlib, zlib, pathlib, subprocess
          encoded=pathlib.Path('.github/capability-presentation.patch.b64').read_text().strip()
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6926f3492c41eaae7246a83837a3a59f976f2076859a339b4c7a196e18f46e9a', 'Patch checksum mismatch'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          node scripts/gen-capability-catalog.mjs
          node scripts/prepare-marketing-pages.mjs
          node scripts/gen-capability-catalog.mjs --check
          node --test scripts/*.test.mjs
          ./scripts/validate-lead-capture.sh
          ./scripts/validate-security-headers.sh
          node scripts/validate-internal-links.mjs
          ./scripts/build-dist.sh
          git diff --check
          git diff --exit-code -- index.html architecture.html editions.html compare-editions.html data/capabilities.v1.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit the source and generated page; remove transfer files
        run: |
          set -euo pipefail
          git config user.name 'Mike McDougall'
          git config user.email 'mike@honua.io'
          git add assets/capability-hub.css assets/capability-hub.js capabilities.html data/capability-navigation.v1.json scripts/capability-hub-render.mjs scripts/capability-hub.test.mjs scripts/capture-design-review.mjs
          git rm .github/capability-presentation.patch.b64 .github/workflows/capability-source-export.yml .github/workflows/capability-presentation-apply.yml
          git commit -m 'fix: surface GeoServices REST, functional groups, and format support'
          git push origin HEAD:refs/heads/website/capabilities-functionality-and-formats
