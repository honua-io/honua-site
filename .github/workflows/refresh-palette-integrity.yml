name: Refresh palette integrity records
on:
  push:
    branches: [website/table-publishing-code-migration]
    paths: ['.github/workflows/refresh-palette-integrity.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ github.sha }}
      - name: Regenerate shared stylesheet digests without changing sample claims
        run: |
          set -euo pipefail
          cp assets/samples/site-exceptions.v1.json "$RUNNER_TEMP/site-exceptions-before.json"
          node scripts/site-sample-exceptions.mjs --write
          python3 - <<'PY'
          import json, os, pathlib
          before = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'site-exceptions-before.json').read_text())
          after = json.loads(pathlib.Path('assets/samples/site-exceptions.v1.json').read_text())
          assert len(before['samples']) == len(after['samples'])
          changed = 0
          for old, new in zip(before['samples'], after['samples']):
              for old_file, new_file in zip(old['files'], new['files']):
                  if old_file != new_file:
                      assert old_file['path'] == new_file['path'] == 'styles.css'
                      old_file.update(new_file)
                      changed += 1
          assert before == after, 'Unexpected change outside shared stylesheet integrity'
          assert changed > 0, 'Expected shared stylesheet integrity refresh'
          print(f'Refreshed {changed} shared stylesheet records; sample claims unchanged.')
          PY
          node scripts/sdk-sample-publication.mjs
          node scripts/site-sample-exceptions.mjs
          node scripts/site-demo-smoke.mjs
          node scripts/validate-demo-backend-override.mjs
          ./scripts/build-dist.sh
      - name: Commit refreshed records and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-palette-integrity.yml
          git config user.name 'Mike McDougall'
          git config user.email 'mike@honua.io'
          git add assets/samples/site-exceptions.v1.json
          git add -u .github/workflows/refresh-palette-integrity.yml
          git diff --cached --stat
          git commit -m 'fix: refresh shared stylesheet integrity in sample records'
          git push origin HEAD:website/table-publishing-code-migration
