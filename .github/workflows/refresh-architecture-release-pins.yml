name: Refresh architecture rollout release pins
on:
  push:
    branches: [website/architecture-clients-databases-interfaces]
    paths: [.github/workflows/refresh-architecture-release-pins.yml]
permissions:
  contents: write
concurrency:
  group: architecture-release-pins
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'honua-io/honua-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ github.sha }}
      - name: Refresh from the canonical SDK documentation manifest
        run: |
          set -euo pipefail
          node scripts/sdk-docs-versions.mjs --refresh
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const snapshot=JSON.parse(fs.readFileSync('data/sdk-docs-versions.v1.json','utf8'));
          const version=snapshot.manifest.latestRelease;
          assert.equal(version,'0.2.9','Review any newer release before updating its public claims');
          for(const name of ['@honua/sdk-js','@honua/sdk-esri-compat']) {
            const response=await fetch('https://registry.npmjs.org/'+encodeURIComponent(name)+'/latest',{signal:AbortSignal.timeout(30000)});
            assert.ok(response.ok,`${name}: registry HTTP ${response.status}`);
            const metadata=await response.json();
            assert.equal(metadata.name,name);
            assert.equal(metadata.version,version);
            console.log(`Verified published ${name} ${metadata.version}`);
          }
          const file='data/sdk-availability.v1.json';
          const availability=JSON.parse(fs.readFileSync(file,'utf8'));
          const sdk=availability.sdks.find(s=>s.packageName==='@honua/sdk-js');
          assert.equal(sdk.publishedVersion,'0.2.8');
          assert.equal(sdk.installCommand,'npm install @honua/sdk-js@0.2.8');
          sdk.publishedVersion=version;
          sdk.installCommand=`npm install @honua/sdk-js@${version}`;
          const compat=sdk.companionPackages.find(p=>p.packageName==='@honua/sdk-esri-compat');
          assert.equal(compat.publishedVersion,'0.2.8');
          compat.publishedVersion=version;
          availability.checkedAt=new Date().toISOString().slice(0,10);
          fs.writeFileSync(file,JSON.stringify(availability,null,2)+'\n');
          const claims=fs.readFileSync('claims.html','utf8');
          const old='<code>@honua/sdk-js 0.2.8</code>';
          assert.equal(claims.split(old).length-1,1);
          fs.writeFileSync('claims.html',claims.replace(old,`<code>@honua/sdk-js ${version}</code>`));
          JS
          node scripts/gen-compatibility-matrix.mjs
          rm .github/workflows/refresh-architecture-release-pins.yml
      - name: Verify release metadata and unchanged publication contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/sdk-docs-versions.mjs --check
          node scripts/sdk-docs-versions.mjs --verify-remote
          node scripts/gen-compatibility-matrix.mjs --check
          node scripts/validate-site-claims.mjs
          node scripts/sdk-sample-publication.mjs
          node scripts/site-sample-exceptions.mjs
          node scripts/site-demo-smoke.mjs
          node scripts/validate-internal-links.mjs
          node --test scripts/*.test.mjs edge/cloudfront-template.test.mjs > "$RUNNER_TEMP/site-tests.log" 2>&1 || { tail -100 "$RUNNER_TEMP/site-tests.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/site-tests.log"
          ./scripts/build-dist.sh
      - name: Commit only the verified release metadata refresh
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- architecture.html assets/architecture-explorer.css index.html data/capabilities.v1.json data/capability-navigation.v1.json
          git config user.name 'Mike McDougall'
          git config user.email 'mike@honua.io'
          git add data/sdk-docs-versions.v1.json data/sdk-availability.v1.json claims.html client-compatibility.html .github/workflows/refresh-architecture-release-pins.yml
          git commit -m 'fix: reconcile public SDK release pins with verified 0.2.9 publication'
          git push origin HEAD:refs/heads/website/architecture-clients-databases-interfaces
